# `docker compose up` runs the real scanner; `docker compose --profile demo up`
# runs the fixture network (COMPOSE_PROFILES=live in .env selects the default).
services:
  app:
    profiles: ["live"]
    build: .
    image: shelly-mesh-manager:latest
    container_name: shelly-mesh-manager
    # Host networking is required for mDNS discovery. Without it (Docker Desktop,
    # rootless, Windows) set SCAN_SUBNET and use the range scan — see README.
    network_mode: host
    environment:
      PORT: ${PORT:-8099}
      SCAN_SUBNET: ${SCAN_SUBNET:-}
      SCAN_INTERVAL_MIN: ${SCAN_INTERVAL_MIN:-15}
      HTTP_TIMEOUT_S: ${HTTP_TIMEOUT_S:-3}
      DEMO_MODE: "false"
    volumes:
      - ./data:/data
    restart: unless-stopped

  demo:
    profiles: ["demo"]
    build: .
    image: shelly-mesh-manager:latest
    container_name: shelly-mesh-manager-demo
    # No host networking needed: demo mode performs no network I/O at all.
    ports:
      - "${PORT:-8099}:8099"
    environment:
      PORT: 8099
      DEMO_MODE: "true"
    volumes:
      - ./data-demo:/data
    restart: unless-stopped
